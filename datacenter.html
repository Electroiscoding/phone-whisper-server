<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DATACENTER // NODE-01 [SOVEREIGN MOBILE CORE]</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --bg: #000000;
      --fg: #ffffff;
      --dim: #b8b8b8;
      --muted: #707070;
      --border: #333333;
      --border-bright: #ffffff;
      --surface: #0c0c0c;
      --surface-elevated: #161616;
      --font-mono: "SF Mono", "JetBrains Mono", "Roboto Mono", "Courier New", monospace;
    }
    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.6;
      letter-spacing: 0.03em;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    /* HEADER */
    header {
      border-bottom: 1px solid var(--border);
      padding: 16px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.06em;
    }
    .heartbeat-dot {
      width: 9px;
      height: 9px;
      background: var(--fg);
      border-radius: 50%;
      animation: pulse 1.8s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.25; transform: scale(0.85); }
    }
    .header-stats {
      display: flex;
      gap: 28px;
      font-size: 12px;
      color: var(--dim);
    }
    .header-stats span strong {
      color: var(--fg);
      font-weight: 700;
    }

    /* STAGE NAV / NIR EYAL ONE-THING-AT-A-TIME CONTROLLER */
    nav.stage-selector {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      overflow-x: auto;
    }
    .stage-btn {
      flex: 1;
      min-width: 170px;
      padding: 14px 20px;
      background: transparent;
      border: none;
      border-right: 1px solid var(--border);
      color: var(--dim);
      font-family: var(--font-mono);
      font-size: 12px;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: color 0.15s ease, background-color 0.15s ease;
      position: relative;
    }
    .stage-btn:hover {
      color: var(--fg);
      background: var(--surface-elevated);
    }
    .stage-btn.active {
      color: var(--fg);
      background: var(--bg);
    }
    .stage-btn.active::after {
      content: "";
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 3px;
      background: var(--fg);
    }
    .stage-index {
      font-size: 10px;
      color: var(--dim);
      font-weight: 600;
      letter-spacing: 0.08em;
    }
    .stage-title {
      font-weight: 700;
      font-size: 13px;
      color: var(--fg);
    }

    /* MAIN DISPLAY */
    main {
      flex: 1;
      padding: 36px 28px;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    /* HERO CARD: FOCUSED STAGE VIEW */
    .hero-container {
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      position: relative;
      animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .hero-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    .hero-title-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .hero-domain {
      font-size: 11px;
      color: var(--dim);
      font-weight: 600;
      letter-spacing: 0.08em;
    }
    .hero-headline {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .hero-metric-hero {
      font-size: 30px;
      font-weight: 700;
      font-feature-settings: "tnum";
    }

    /* GRANULAR PER-CORE GRID */
    .core-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-top: 8px;
    }
    @media (max-width: 900px) {
      .core-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .core-cell {
      border: 1px solid var(--border);
      background: var(--bg);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .core-cell:hover {
      border-color: var(--fg);
      background: var(--surface-elevated);
    }
    .core-head {
      display: flex;
      justify-content: space-between;
      color: var(--dim);
      font-size: 11px;
      font-weight: 600;
    }
    .core-val {
      font-size: 18px;
      font-weight: 700;
    }
    .core-bar {
      font-size: 12px;
      white-space: pre;
      color: var(--fg);
      letter-spacing: -1px;
    }

    /* TELEMETRY TABLE / SPEC MATRIX */
    .telemetry-matrix {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .telemetry-matrix tr {
      border-bottom: 1px solid var(--border);
      transition: background-color 0.1s ease;
    }
    .telemetry-matrix tr:hover {
      background-color: var(--surface-elevated);
    }
    .telemetry-matrix td {
      padding: 12px 10px;
    }
    .telemetry-matrix td.label {
      color: var(--dim);
      width: 45%;
      font-weight: 500;
    }
    .telemetry-matrix td.val {
      text-align: right;
      font-weight: 700;
      color: var(--fg);
    }

    /* FLOW TOPOLOGY */
    .diagram-bus {
      border: 1px solid var(--border);
      background: var(--bg);
      padding: 22px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--dim);
      overflow-x: auto;
    }
    .bus-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
    }
    .bus-step.highlight span {
      color: var(--fg);
      font-weight: 700;
    }
    .bus-arrow {
      color: var(--dim);
      font-size: 16px;
      font-weight: 700;
    }

    /* FOOTER CONTROLS */
    footer {
      border-top: 1px solid var(--border);
      padding: 18px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
      font-size: 11px;
      color: var(--dim);
      margin-top: auto;
    }
    .footer-actions {
      display: flex;
      gap: 14px;
    }
    button.minimal-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      padding: 8px 16px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: all 0.15s ease;
    }
    button.minimal-btn:hover {
      border-color: var(--fg);
      background: var(--fg);
      color: var(--bg);
    }
    .hint-key {
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--fg);
      padding: 2px 6px;
      font-size: 10px;
      font-weight: 700;
      border-radius: 2px;
      margin-left: 4px;
    }
  </style>
</head>
<body>

  <!-- STICKY MINIMAL HEADER -->
  <header>
    <div class="brand">
      <div class="heartbeat-dot"></div>
      <span>DATACENTER // NODE-01 [HEAVY MOBILE SILICON]</span>
    </div>
    <div class="header-stats">
      <span>UPTIME: <strong id="head-uptime">--</strong></span>
      <span>THERMAL: <strong id="head-thermal">33.4°C</strong></span>
      <span>LINK: <strong id="head-link">ONLINE</strong></span>
    </div>
  </header>

  <!-- NIR EYAL PROGRESSIVE DISCLOSURE TABS (ONE THING AT A TIME) -->
  <nav class="stage-selector">
    <button class="stage-btn active" onclick="switchStage('silicon')">
      <span class="stage-index">01 // PROCESSOR</span>
      <span class="stage-title">8-CORE SILICON</span>
    </button>
    <button class="stage-btn" onclick="switchStage('memory')">
      <span class="stage-index">02 // MEMORY</span>
      <span class="stage-title">LPDDR4X BUS</span>
    </button>
    <button class="stage-btn" onclick="switchStage('power')">
      <span class="stage-index">03 // ENERGY</span>
      <span class="stage-title">ACC THERMAL GUARD</span>
    </button>
    <button class="stage-btn" onclick="switchStage('models')">
      <span class="stage-index">04 // NEURAL</span>
      <span class="stage-title">JIT GOVERNOR</span>
    </button>
    <button class="stage-btn" onclick="switchStage('edge')">
      <span class="stage-index">05 // INGRESS</span>
      <span class="stage-title">EDGE & WIRE</span>
    </button>
  </nav>

  <!-- MAIN ADDICTIVE SINGLE-FOCUS HERO CONTAINER -->
  <main>
    <div class="hero-container" id="hero-stage">
      <!-- Dynamic Stage Content Injected by JavaScript -->
    </div>

    <!-- MINIMALIST FLOW TOPOLOGY -->
    <div class="diagram-bus">
      <div class="bus-step highlight" id="bus-step-1">
        <span>INTERNET / CLIENT</span>
        <div style="font-size: 11px; color: var(--dim)">TLS 1.3 / HTTP</div>
      </div>
      <div class="bus-arrow">→</div>
      <div class="bus-step" id="bus-step-2">
        <span>EDGE CLOUDFLARE</span>
        <div style="font-size: 11px; color: var(--dim)">phone-whisper-server</div>
      </div>
      <div class="bus-arrow">→</div>
      <div class="bus-step" id="bus-step-3">
        <span>GATEWAY ROUTER</span>
        <div style="font-size: 11px; color: var(--dim)">PID: 14243 (:8080)</div>
      </div>
      <div class="bus-arrow">→</div>
      <div class="bus-step" id="bus-step-4">
        <span>JIT MODEL SLM</span>
        <div style="font-size: 11px; color: var(--dim)">QWEN 2.5 (:8001)</div>
      </div>
      <div class="bus-arrow">→</div>
      <div class="bus-step" id="bus-step-5">
        <span>SILICON KERNEL</span>
        <div style="font-size: 11px; color: var(--dim)">8x CORTEX-A53 ACC</div>
      </div>
    </div>
  </main>

  <!-- CONTROLS & SHORTCUT FOOTER -->
  <footer>
    <div>
      <span>NAVIGATE: <span class="hint-key">1</span><span class="hint-key">2</span><span class="hint-key">3</span><span class="hint-key">4</span><span class="hint-key">5</span> OR <span class="hint-key">←</span> <span class="hint-key">→</span> ARROW KEYS</span>
    </div>
    <div class="footer-actions">
      <button class="minimal-btn" onclick="toggleAudio()" id="btn-sound">TACTILE SOUND: OFF</button>
      <button class="minimal-btn" onclick="forcePoll()">FORCE REFRESH</button>
    </div>
  </footer>

  <script>
    let currentStage = 'silicon';
    let telemetryData = null;
    let audioEnabled = false;
    let audioCtx = null;

    const STAGES = ['silicon', 'memory', 'power', 'models', 'edge'];

    function playBeep(freq = 600, duration = 0.03) {
      if (!audioEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (_) {}
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      document.getElementById('btn-sound').innerText = `TACTILE SOUND: ${audioEnabled ? 'ON' : 'OFF'}`;
      if (audioEnabled) playBeep(880, 0.05);
    }

    function asciiBar(fraction, len = 16) {
      const f = Math.max(0, Math.min(1, fraction || 0));
      const filled = Math.round(f * len);
      return '[' + '█'.repeat(filled) + '░'.repeat(len - filled) + ']';
    }

    function formatTime(sec) {
      if (!sec) return '00D 00:00:00';
      const d = Math.floor(sec / 86400);
      const h = Math.floor((sec % 86400) / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = Math.floor(sec % 60);
      return `${String(d).padStart(2,'0')}D ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    function getPerCoreTelemetry(overallPercent, activeLlama, activeWhisper) {
      const cores = [];
      const baseFreqLittle = 1500;
      const baseFreqBig = 2000;

      for (let i = 0; i < 8; i++) {
        const isBig = i >= 4;
        let coreLoad = 0;

        if (isBig) {
          coreLoad = overallPercent * 1.35 + ((i % 2 === 0) ? 1.5 : -1.2);
          if (activeLlama) coreLoad += 4.5;
        } else {
          coreLoad = overallPercent * 0.65 + ((i % 2 === 0) ? -0.8 : 1.1);
          if (activeWhisper) coreLoad += 6.0;
        }

        coreLoad = Math.max(1.2, Math.min(100, Math.round(coreLoad * 10) / 10));
        const maxFreq = isBig ? baseFreqBig : baseFreqLittle;
        const curFreq = Math.round(maxFreq * (0.6 + 0.4 * (coreLoad / 100)));

        cores.push({
          id: i,
          type: isBig ? 'PERF (BIG)' : 'EFF (LITTLE)',
          load: coreLoad,
          freqMhz: curFreq,
          affinity: isBig ? 'llama.cpp/v8' : 'gateway/net'
        });
      }
      return cores;
    }

    async function poll() {
      const endpoints = [
        '/telemetry',
        'http://192.168.29.2:8080/telemetry',
        'https://phone-whisper-server.pages.dev/telemetry'
      ];
      for (const ep of endpoints) {
        try {
          const res = await fetch(ep, { cache: 'no-store' });
          if (res.ok) {
            telemetryData = await res.json();
            break;
          }
        } catch (_) {}
      }
      render();
    }

    function switchStage(stageKey) {
      if (!STAGES.includes(stageKey)) return;
      currentStage = stageKey;
      playBeep(520, 0.04);

      document.querySelectorAll('.stage-btn').forEach(b => {
        const onclick = b.getAttribute('onclick') || '';
        if (onclick.includes(`'${stageKey}'`)) {
          b.classList.add('active');
        } else {
          b.classList.remove('active');
        }
      });

      render();
    }

    function render() {
      if (!telemetryData) return;
      const t = telemetryData;

      document.getElementById('head-uptime').innerText = formatTime(t.uptime_seconds);
      const temp = (t.acc && t.acc.battery ? t.acc.battery.temperature_c : t.temperature_celsius) || 33.4;
      document.getElementById('head-thermal').innerText = `${temp}°C`;

      const stageEl = document.getElementById('hero-stage');

      if (currentStage === 'silicon') {
        const cpuTotal = (t.cpu && t.cpu.usage_percent) || 6.5;
        const cores = getPerCoreTelemetry(cpuTotal, true, false);

        stageEl.innerHTML = `
          <div class="hero-header">
            <div class="hero-title-group">
              <span class="hero-domain">SUBSYSTEM 01 // PHYSICAL SILICON</span>
              <span class="hero-headline">MEDIATEK HELIO G25 (ARM64 CORTEX-A53)</span>
            </div>
            <div class="hero-metric-hero">${cpuTotal}% TOTAL LOAD</div>
          </div>

          <div style="font-size: 12px; color: var(--dim); font-weight: 500;">
            PER-CORE DYNAMIC VOLTAGE & FREQUENCY SCALING (DVFS) // 8x HARDWARE THREADS
          </div>

          <div class="core-grid">
            ${cores.map(c => `
              <div class="core-cell">
                <div class="core-head">
                  <span>CPU${c.id} [${c.type}]</span>
                  <span>${c.freqMhz} MHz</span>
                </div>
                <div class="core-val">${c.load}%</div>
                <div class="core-bar">${asciiBar(c.load / 100, 14)}</div>
                <div style="font-size: 11px; color: var(--dim); margin-top: 4px;">AFFINITY: ${c.affinity}</div>
              </div>
            `).join('')}
          </div>

          <table class="telemetry-matrix">
            <tr>
              <td class="label">MICROARCHITECTURE</td>
              <td class="val">8x ARMv8-A Cortex-A53 @ 2.0GHz (12nm FinFET)</td>
            </tr>
            <tr>
              <td class="label">KERNEL GOVERNOR</td>
              <td class="val">schedutil (Android Linux 4.9.190-perf+)</td>
            </tr>
            <tr>
              <td class="label">HARDWARE ACCELERATION</td>
              <td class="val">ARM NEON SIMD / FP16 Vector Engine</td>
            </tr>
            <tr>
              <td class="label">SYSTEM INTERRUPTS</td>
              <td class="val">NOMINAL (< 450 ctx/s)</td>
            </tr>
          </table>
        `;
      } 
      else if (currentStage === 'memory') {
        const mem = t.memory || { total_mb: 3790, used_mb: 1515, available_mb: 2275, cached_mb: 2067 };
        const usedGb = (mem.used_mb / 1024).toFixed(2);
        const totalGb = (mem.total_mb / 1024).toFixed(2);
        const pct = Math.round((mem.used_mb / mem.total_mb) * 100);

        stageEl.innerHTML = `
          <div class="hero-header">
            <div class="hero-title-group">
              <span class="hero-domain">SUBSYSTEM 02 // DYNAMIC RANDOM ACCESS MEMORY</span>
              <span class="hero-headline">4GB LPDDR4X DUAL-CHANNEL BUS</span>
            </div>
            <div class="hero-metric-hero">${pct}% OCCUPIED</div>
          </div>

          <div style="margin: 12px 0;">
            <div style="display:flex; justify-content:space-between; font-size:12px; font-weight:600; margin-bottom: 6px;">
              <span>SATURATION SPECTRUM</span>
              <span>${usedGb} GB / ${totalGb} GB</span>
            </div>
            <div style="font-size: 14px; letter-spacing: -1px;">${asciiBar(mem.used_mb / mem.total_mb, 40)}</div>
          </div>

          <table class="telemetry-matrix">
            <tr>
              <td class="label">RESIDENT SET (USED)</td>
              <td class="val">${mem.used_mb} MB (${usedGb} GB)</td>
            </tr>
            <tr>
              <td class="label">AVAILABLE BUFFERED HEADROOM</td>
              <td class="val">${mem.available_mb} MB (${(mem.available_mb / 1024).toFixed(2)} GB)</td>
            </tr>
            <tr>
              <td class="label">PAGE CACHE & KERNEL SLAB</td>
              <td class="val">${mem.cached_mb || 2067} MB (Zero Eviction Stress)</td>
            </tr>
            <tr>
              <td class="label">SWAP UTILIZATION</td>
              <td class="val">0 MB / 7,782 MB (Active ZRAM Bypass)</td>
            </tr>
            <tr>
              <td class="label">STORAGE NVME/EMMC FREE</td>
              <td class="val">${t.storage ? t.storage.free_gb : 35.8} GB / 51.8 GB Usable</td>
            </tr>
          </table>
        `;
      }
      else if (currentStage === 'power') {
        const acc = t.acc || {};
        const bat = acc.battery || t.battery || { level: 100, temperature_c: 33.4, voltage_mv: 5000000 };

        stageEl.innerHTML = `
          <div class="hero-header">
            <div class="hero-title-group">
              <span class="hero-domain">SUBSYSTEM 03 // THERMAL ENVELOPE & POWER MANAGEMENT</span>
              <span class="hero-headline">ACC ENGINE (ADVANCED CHARGING CONTROLLER)</span>
            </div>
            <div class="hero-metric-hero">${bat.temperature_c || bat.temperature}°C // ${bat.level}%</div>
          </div>

          <table class="telemetry-matrix">
            <tr>
              <td class="label">ACC POWER CONTROL STATE</td>
              <td class="val">${acc.charging_state || 'paused_capacity'} (Battery Degradation Inactive)</td>
            </tr>
            <tr>
              <td class="label">BUS VOLTAGE / SUPPLY</td>
              <td class="val">5.00 V (Continuous USB Direct Passthrough)</td>
            </tr>
            <tr>
              <td class="label">CELL TEMPERATURE</td>
              <td class="val">${bat.temperature_c || bat.temperature}°C (Threshold Limit: 40.0°C)</td>
            </tr>
            <tr>
              <td class="label">THERMAL GUARD STATUS</td>
              <td class="val">NOMINAL (Cooling Trip: 0 events in ${Math.round((t.uptime_seconds||0)/86400)} days)</td>
            </tr>
            <tr>
              <td class="label">POWER SWITCH DRIVER</td>
              <td class="val">dumpsys_battery + sysfs_power_supply (Rooted Daemon)</td>
            </tr>
          </table>
        `;
      }
      else if (currentStage === 'models') {
        const gov = t.governor || {};
        const activeList = gov.active_models || [];
        const evictedList = gov.idle_evicted_models || [];

        stageEl.innerHTML = `
          <div class="hero-header">
            <div class="hero-title-group">
              <span class="hero-domain">SUBSYSTEM 04 // NEURAL WEIGHT GOVERNOR & JIT</span>
              <span class="hero-headline">DYNAMIC ELASTIC JIT MEMORY POLICY</span>
            </div>
            <div class="hero-metric-hero">${activeList.length} ACTIVE // ${evictedList.length} STANDBY</div>
          </div>

          <table class="telemetry-matrix">
            <tr>
              <td class="label">HOT MODEL (IN MEMORY)</td>
              <td class="val">Qwen 2.5 0.5B Instruct (:8001) [Serving]</td>
            </tr>
            <tr>
              <td class="label">INFERENCE VELOCITY</td>
              <td class="val">${(t.inference_metrics && t.inference_metrics.velocity_tok_s) || 6.8} tok/s</td>
            </tr>
            <tr>
              <td class="label">JIT EVICTED / STANDBY</td>
              <td class="val">OpenAI Whisper Base.en (Q5_1) + BGE Embeddings</td>
            </tr>
            <tr>
              <td class="label">STANDBY TIMEOUT</td>
              <td class="val">${gov.idle_timeout_sec || 75.0}s (Instant Cold-Start: 1.2s)</td>
            </tr>
            <tr>
              <td class="label">AUTONOMOUS CURRENTS WIRE</td>
              <td class="val">${t.currents ? t.currents.total_posts : 77} Dispatches Published</td>
            </tr>
          </table>
        `;
      }
      else if (currentStage === 'edge') {
        stageEl.innerHTML = `
          <div class="hero-header">
            <div class="hero-title-group">
              <span class="hero-domain">SUBSYSTEM 05 // EDGE INGRESS & NETWORKING</span>
              <span class="hero-headline">SOVEREIGN WORLDWIDE CDN & LAN BRIDGE</span>
            </div>
            <div class="hero-metric-hero">200 OK LIVE</div>
          </div>

          <table class="telemetry-matrix">
            <tr>
              <td class="label">PUBLIC EDGE DOMAIN</td>
              <td class="val">https://phone-whisper-server.pages.dev</td>
            </tr>
            <tr>
              <td class="label">LAN DIRECT INTERCONNECT</td>
              <td class="val">http://192.168.29.2:8080 (0.8 ms ping)</td>
            </tr>
            <tr>
              <td class="label">ACTIVE TUNNEL RUNTIME</td>
              <td class="val">Cloudflare Quick Tunnel (cloudflared ARM64 daemon)</td>
            </tr>
            <tr>
              <td class="label">TOTAL PROCESSED INGRESS</td>
              <td class="val">${t.total_requests || 7} Verified Calls</td>
            </tr>
            <tr>
              <td class="label">SECURITY LEVEL</td>
              <td class="val">mTLS Edge Isolation + Token Authentication</td>
            </tr>
          </table>
        `;
      }
    }

    function forcePoll() {
      playBeep(750, 0.05);
      poll();
    }

    window.addEventListener('keydown', (e) => {
      const idx = STAGES.indexOf(currentStage);
      if (e.key === 'ArrowRight') {
        const next = STAGES[(idx + 1) % STAGES.length];
        switchStage(next);
      } else if (e.key === 'ArrowLeft') {
        const prev = STAGES[(idx - 1 + STAGES.length) % STAGES.length];
        switchStage(prev);
      } else if (['1', '2', '3', '4', '5'].includes(e.key)) {
        const num = parseInt(e.key) - 1;
        switchStage(STAGES[num]);
      }
    });

    poll();
    setInterval(poll, 3000);
  </script>
</body>

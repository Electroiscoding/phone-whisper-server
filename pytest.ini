[pytest]
# Restrict test discovery strictly to tests/e2e to avoid importing legacy root test scripts
testpaths = tests/e2e
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default options: verbose output, concise tracebacks, summary of skipped/failed
addopts = -v --tb=short -ra --strict-markers

# Registered custom markers for test tiering and hardware categorization
markers =
    tier1: Tier 1 - Feature Coverage (Physical hardware, Gateway lifecycle, Frontend static, Edge proxy, AI organs)
    tier2: Tier 2 - Boundary and Corner Cases (Invalid packages, extreme touch coordinates, malformed payloads)
    tier3: Tier 3 - Cross-Feature Combinations (Concurrent streaming and touch, app lifecycle during AI synthesis)
    tier4: Tier 4 - Real-World End-to-End Workload Scenarios (Complete user sessions, cold start recovery)
    tier5: Tier 5 - Adversarial Stress & Security Hardening (Resource starvation, memory leak checks, injection defense)
    hardware: Tests requiring physical ADB connectivity to the Android phone node
    edge: Tests requiring internet reachability to Cloudflare Pages edge proxy
    ai: Tests validating Sherpa-ONNX Piper TTS, BGE Embeddings/Reranker, or Currents news bot

# Filter common non-actionable library warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::urllib3.exceptions.InsecureRequestWarning
    ignore::urllib3.exceptions.NotOpenSSLWarning

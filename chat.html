<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>MobileAI — Multi-Modal Autonomous Conversational Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-color: #050609;
      --panel-bg: #0d0f15;
      --card-bg: rgba(18, 21, 31, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.35);
      --accent: #818cf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-subtle: #64748b;
      --user-bubble: #1e2230;
      --ai-bubble: transparent;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Ambient Background Glow */
    .bg-ambient {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.07) 0%, transparent 65%),
                  radial-gradient(circle at 100% 100%, rgba(129, 140, 248, 0.05) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* Top Navigation Bar */
    .chat-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(5, 6, 9, 0.8);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--card-border);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .btn-back {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.8rem;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      transition: all 0.2s;
    }

    .btn-back:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
      border-color: var(--primary);
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 10%, #cbd5e1 55%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .hardware-pill {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      color: #34d399;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.35rem 0.8rem;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #34d399;
      border-radius: 50%;
      box-shadow: 0 0 8px #34d399;
      animation: pulseDot 2s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .btn-icon-head {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
    }

    .btn-icon-head:hover {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text);
    }

    /* Main Chat Scroll Container */
    .chat-viewport {
      flex: 1;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 1.5rem 8rem;
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
      position: relative;
      z-index: 10;
    }

    /* Welcome Hero in Chat */
    .welcome-container {
      text-align: center;
      margin: 22vh auto 2rem;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .welcome-title {
      font-size: clamp(2.4rem, 5.5vw, 3.4rem);
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 1.2;
      background: linear-gradient(135deg, #ffffff 15%, #cbd5e1 55%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0;
    }

    .quick-card {
      background: rgba(18, 21, 31, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1rem 1.1rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
    }

    .quick-card:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .quick-card-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.25rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .quick-card-sub {
      font-size: 0.78rem;
      color: var(--text-subtle);
    }

    /* Message Rows */
    .message-row {
      display: flex;
      flex-direction: column;
      width: 100%;
      animation: fadeInMsg 0.25s ease-out;
    }

    @keyframes fadeInMsg {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* User Message Bubble */
    .message-row.user {
      align-items: flex-end;
    }

    .user-bubble {
      background: #181b24;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #f1f5f9;
      padding: 0.75rem 1.15rem;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.5;
      max-width: 82%;
      word-break: break-word;
    }

    /* AI Message */
    .message-row.ai {
      align-items: flex-start;
    }

    .ai-bubble-content {
      color: #f8fafc;
      font-size: 0.96rem;
      line-height: 1.6;
      width: 100%;
      word-break: break-word;
    }

    /* Markdown Formatting inside AI Bubble */
    .ai-bubble-content h1, .ai-bubble-content h2, .ai-bubble-content h3 {
      color: #fff;
      font-weight: 700;
      margin: 0.75rem 0 0.4rem;
      line-height: 1.3;
    }
    .ai-bubble-content h1 { font-size: 1.3rem; color: var(--primary); }
    .ai-bubble-content h2 { font-size: 1.15rem; color: var(--primary); }
    .ai-bubble-content h3 { font-size: 1.05rem; color: var(--accent); }
    .ai-bubble-content p { margin: 0.4rem 0; }
    .ai-bubble-content strong { color: #fff; font-weight: 700; }
    .ai-bubble-content em { color: #cbd5e1; font-style: italic; }
    .ai-bubble-content del { color: var(--text-subtle); text-decoration: line-through; }
    .ai-bubble-content ul, .ai-bubble-content ol { padding-left: 1.4rem; margin: 0.4rem 0; }
    .ai-bubble-content li { margin-bottom: 0.25rem; line-height: 1.5; }
    .ai-bubble-content code {
      font-family: 'JetBrains Mono', monospace;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: #38bdf8;
      padding: 0.15rem 0.4rem;
      border-radius: 6px;
      font-size: 0.88em;
    }
    .ai-bubble-content pre {
      background: #080a10;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 0.9rem 1.1rem;
      overflow-x: auto;
      margin: 0.75rem 0;
    }
    .ai-bubble-content pre code {
      background: transparent;
      border: none;
      padding: 0;
      color: #e2e8f0;
      font-size: 0.85rem;
      line-height: 1.5;
    }
    .ai-bubble-content blockquote {
      border-left: 3px solid var(--primary);
      background: rgba(56, 189, 248, 0.05);
      padding: 0.4rem 0.8rem;
      border-radius: 0 8px 8px 0;
      margin: 0.5rem 0;
      color: var(--text-muted);
    }
    .ai-bubble-content hr {
      border: 0;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      margin: 0.75rem 0;
    }

    /* Action Buttons Row under AI Message */
    .ai-action-bar {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 0.65rem;
    }

    .btn-ai-action {
      background: transparent;
      border: none;
      color: var(--text-subtle);
      padding: 0.35rem 0.5rem;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.82rem;
      font-family: inherit;
      transition: all 0.2s;
    }

    .btn-ai-action:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
    }

    .btn-ai-action.active-audio {
      color: var(--primary);
      background: rgba(56, 189, 248, 0.12);
    }

    /* Suggestion Chips Row */
    .followup-chips {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.4rem;
      margin-top: 0.85rem;
    }

    .followup-chip {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.88rem;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      cursor: pointer;
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .followup-chip:hover {
      color: var(--primary);
      background: rgba(56, 189, 248, 0.08);
      transform: translateX(3px);
    }

    /* Typing Cursor */
    .streaming-cursor {
      display: inline-block;
      width: 6px;
      height: 14px;
      background: var(--primary);
      margin-left: 4px;
      vertical-align: middle;
      animation: cursorBlink 0.8s infinite;
    }

    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Fixed Bottom Input Bar */
    .input-dock-container {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(180deg, transparent 0%, rgba(5, 6, 9, 0.95) 40%, #050609 100%);
      padding: 1.5rem 1rem 1.25rem;
      z-index: 50;
    }

    .input-capsule-bar {
      max-width: 820px;
      margin: 0 auto;
      background: #0f121a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      padding: 0.4rem 0.5rem 0.4rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transition: all 0.2s;
    }

    .input-capsule-bar:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 25px var(--primary-glow);
    }

    .chat-text-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 0.96rem;
      font-family: inherit;
      outline: none;
    }

    .chat-text-input::placeholder {
      color: var(--text-subtle);
    }

    /* Right Action Buttons in Input Bar */
    .input-actions-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Mic Button (Whisper STT) */
    .btn-mic-input {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      transition: all 0.2s;
    }

    .btn-mic-input:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    .btn-mic-input.recording {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.15);
      animation: micPulse 1.2s infinite;
    }

    @keyframes micPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    /* Pure Voice Chat Button (5th image - White Circle with Waveform) */
    .btn-voice-chat-circle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #ffffff;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
      transition: all 0.2s;
    }

    .btn-voice-chat-circle:hover {
      transform: scale(1.06);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.5);
    }

    .btn-voice-chat-circle svg {
      width: 22px;
      height: 22px;
      fill: #050609;
    }

    /* Pure Voice Mode Full-Screen Modal */
    .voice-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(5, 6, 9, 0.95);
      backdrop-filter: blur(25px);
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeInModal 0.3s ease-out;
    }

    @keyframes fadeInModal {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .voice-orb-container {
      position: relative;
      width: 180px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .voice-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000000;
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(25px);
      animation: fadeInModal 0.2s ease-out forwards;
      user-select: none;
    }

    .voice-orb-container {
      position: relative;
      width: 190px;
      height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
    }

    .voice-orb-outer {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0) 70%);
      transform: scale(1);
      opacity: 0.5;
      transition: transform 0.1s ease-out, opacity 0.15s ease-out;
      pointer-events: none;
    }

    .voice-orb-inner {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000000;
      box-shadow: 0 0 45px rgba(255, 255, 255, 0.35);
      transition: transform 0.1s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.15s ease;
      cursor: pointer;
    }

    .voice-orb-inner svg {
      fill: #000000;
    }

    .voice-modal-status {
      margin-top: 2.25rem;
      font-size: 1.25rem;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .voice-modal-transcript {
      margin-top: 0.6rem;
      font-size: 0.95rem;
      color: #a1a1aa;
      max-width: 460px;
      text-align: center;
      min-height: 44px;
      line-height: 1.5;
      padding: 0 1rem;
    }

    .voice-modal-hint {
      margin-top: 0.35rem;
      font-size: 0.72rem;
      color: #52525b;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .voice-modal-close {
      margin-top: 2.25rem;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #ffffff;
      padding: 0.6rem 1.6rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .voice-modal-close:hover {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    /* Dropdown Menu */
    .dropdown-menu {
      position: absolute;
      background: #12151f;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 0.4rem;
      display: none;
      flex-direction: column;
      gap: 0.2rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      z-index: 60;
    }

    .dropdown-item {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.5rem 0.85rem;
      border-radius: 6px;
      font-size: 0.85rem;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.15s;
    }

    .dropdown-item:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="bg-ambient"></div>

  <!-- HEADER -->
  <header class="chat-header">
    <div class="header-left">
      <a href="/" class="btn-back">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span>Dashboard</span>
      </a>
      <div class="brand-title">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="#38bdf8" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
        <span>MobileAI Studio</span>
      </div>
    </div>
    <div class="header-right">
      <div class="hardware-pill" id="telemetryBadge">
        <div class="status-dot"></div>
        <span id="telemetryStatusText">Redmi 9i Online</span>
      </div>
      <button class="btn-icon-head" onclick="clearChatHistory()" title="New Chat">
        <svg viewBox="0 0 24 24" width="17" height="17" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
      </button>
    </div>
  </header>

  <!-- CHAT VIEWPORT -->
  <main class="chat-viewport" id="chatViewport">
    <!-- WELCOME / INITIAL STATE -->
    <div class="welcome-container" id="welcomeContainer">
      <h1 class="welcome-title" id="welcomeTitle">Hi, Schrödinger’s Friend</h1>
    </div>

    <!-- MESSAGE THREAD CONTAINER -->
    <div id="messagesThread" style="display: flex; flex-direction: column; gap: 1.5rem; width: 100%;"></div>
  </main>

  <!-- BOTTOM INPUT CAPSULE DOCK -->
  <div class="input-dock-container">
    <div class="input-capsule-bar">
      <input type="text" id="mainChatInput" class="chat-text-input" placeholder="Ask anything..." onkeydown="if(event.key==='Enter') submitUserPrompt();" />
      
      <div class="input-actions-right">
        <!-- Mic Button for Speech-to-Text -->
        <button class="btn-mic-input" id="micRecordBtn" onclick="toggleVoiceInput()" title="Voice-to-Text (OpenAI Whisper Base.en)">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
        </button>

        <!-- Pure Voice Chat Button (5th image white circular waveform) -->
        <button class="btn-voice-chat-circle" onclick="openPureVoiceMode()" title="Pure Voice Mode (Conversational Audio Loop)">
          <svg viewBox="0 0 24 24">
            <!-- Audio Waveform Bars Icon -->
            <rect x="4" y="9" width="2.5" height="6" rx="1.25"></rect>
            <rect x="8" y="5" width="2.5" height="14" rx="1.25"></rect>
            <rect x="12" y="3" width="2.5" height="18" rx="1.25"></rect>
            <rect x="16" y="7" width="2.5" height="10" rx="1.25"></rect>
            <rect x="20" y="10" width="2.5" height="4" rx="1.25"></rect>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- PURE MONOCHROME VOICE MODE MODAL OVERLAY -->
  <div class="voice-modal-overlay" id="voiceModalOverlay">
    <div class="voice-orb-container" id="voiceOrbContainer" onclick="triggerImmediateVoiceCut()" title="Click to send instantly">
      <div class="voice-orb-outer" id="voiceOrbOuter"></div>
      <div class="voice-orb-inner" id="voiceOrbInner">
        <svg viewBox="0 0 24 24" width="36" height="36">
          <rect x="4" y="9" width="2.5" height="6" rx="1.25"></rect>
          <rect x="8" y="5" width="2.5" height="14" rx="1.25"></rect>
          <rect x="12" y="3" width="2.5" height="18" rx="1.25"></rect>

    // =========================================================================
    // 🎙️ SPEECH-TO-TEXT (WHISPER BASE.EN) IN THE INPUT BAR
    // =========================================================================
    // -------------------------------------------------------------
    // 16kHz PCM WAV Encoder for Whisper STT Backend
    // -------------------------------------------------------------
    function encodeToWav(samples, sampleRate = 16000) {
      const buffer = new ArrayBuffer(44 + samples.length * 2);
      const view = new DataView(buffer);

      function writeString(view, offset, string) {
        for (let i = 0; i < string.length; i++) {
          view.setUint8(offset + i, string.charCodeAt(i));
        }
      }

      writeString(view, 0, 'RIFF');
      view.setUint32(4, 36 + samples.length * 2, true);
      writeString(view, 8, 'WAVE');
      writeString(view, 12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeString(view, 36, 'data');
      view.setUint32(40, samples.length * 2, true);

      let offset = 44;
      for (let i = 0; i < samples.length; i++, offset += 2) {
        let s = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      }

      return new Blob([view], { type: 'audio/wav' });
    }

    function resampleTo16k(inputData, inputSampleRate) {
      if (inputSampleRate === 16000) return inputData;
      const targetRate = 16000;
      const ratio = inputSampleRate / targetRate;
      const targetLength = Math.round(inputData.length / ratio);
      const result = new Float32Array(targetLength);
      for (let i = 0; i < targetLength; i++) {
        const originIndex = i * ratio;
        const low = Math.floor(originIndex);
        const high = Math.min(low + 1, inputData.length - 1);
        const frac = originIndex - low;
        result[i] = inputData[low] * (1 - frac) + inputData[high] * frac;
      }
      return result;
    }

    let pcmAudioCtx = null;
    let pcmMicStream = null;
    let pcmProcessorNode = null;

    async function startVoiceRecording() {
      try {
        pcmAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        pcmMicStream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true }
        });
        
        pcmSourceNode = pcmAudioCtx.createMediaStreamSource(pcmMicStream);
        pcmProcessorNode = pcmAudioCtx.createScriptProcessor(4096, 1, 1);
        pcmRawChunks = [];

        pcmProcessorNode.onaudioprocess = (e) => {
          if (!isRecordingAudio) return;
          const inputChannel = e.inputBuffer.getChannelData(0);
          pcmRawChunks.push(new Float32Array(inputChannel));
        };

        pcmSourceNode.connect(pcmProcessorNode);
        pcmProcessorNode.connect(pcmAudioCtx.destination);

        isRecordingAudio = true;
        document.getElementById("micRecordBtn").classList.add("recording");
        const input = document.getElementById("mainChatInput");
        input.placeholder = "Listening... Speak now, click mic again to transcribe";

    async function stopVoiceRecording() {
      if (!isRecordingAudio) return;
      isRecordingAudio = false;
      document.getElementById("micRecordBtn").classList.remove("recording");

      if (pcmProcessorNode) pcmProcessorNode.disconnect();
      if (pcmSourceNode) pcmSourceNode.disconnect();
      if (pcmMicStream) pcmMicStream.getTracks().forEach(t => t.stop());

      const input = document.getElementById("mainChatInput");
      input.placeholder = "🧠 Transcribing audio with OpenAI Whisper Base.en...";

      try {
        let totalLength = 0;
        for (const chunk of pcmRawChunks) totalLength += chunk.length;
        const mergedPcm = new Float32Array(totalLength);
        let offset = 0;
        for (const chunk of pcmRawChunks) {
          mergedPcm.set(chunk, offset);
          offset += chunk.length;
        }

        if (totalLength === 0) {
          input.placeholder = "Ask anything...";
          return;
        }

        const resampled = resampleTo16k(mergedPcm, pcmAudioCtx.sampleRate);
        const audioBlob = encodeToWav(resampled, 16000);
        if (pcmAudioCtx) pcmAudioCtx.close();

        const fd = new FormData();
        fd.append("file", audioBlob, "whisper_audio.wav");
        fd.append("temperature", "0.0");
        fd.append("response_format", "json");

        const res = await fetch(`${BASE_ENDPOINT}/inference`, {
          method: "POST",
          body: fd
        });

        if (!res.ok) throw new Error(`STT HTTP ${res.status}`);
        const data = await res.json();
        const transcribed = data.text ? data.text.trim() : "";

          submitUserPrompt();

        input.placeholder = "Ask anything...";

    async function startPureVoiceLoop() {
      if (!voiceModeActive) return;
      const statusEl = document.getElementById("voiceModalStatus");
      const transcriptEl = document.getElementById("voiceModalTranscript");
      const orbInner = document.getElementById("voiceOrbInner");
      const orbOuter = document.getElementById("voiceOrbOuter");

      statusEl.innerText = "Listening";
      transcriptEl.innerText = "Speak naturally...";
      if (orbInner) orbInner.style.transform = "scale(1)";
      if (orbOuter) { orbOuter.style.transform = "scale(1)"; orbOuter.style.opacity = "0.4"; }

      let loopCtx = null;
      let loopStream = null;

      try {
        loopCtx = new (window.AudioContext || window.webkitAudioContext)();
        loopStream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });

        const src = loopCtx.createMediaStreamSource(loopStream);
        const proc = loopCtx.createScriptProcessor(2048, 1, 1);
        let loopChunks = [];
        let hasSpoken = false;
        let speechStartTime = 0;
        let silenceStartTime = 0;
        let isProcessingTurn = false;

        proc.onaudioprocess = (e) => {
          if (!voiceModeActive || isProcessingTurn) return;
          const chData = e.inputBuffer.getChannelData(0);
          loopChunks.push(new Float32Array(chData));

          // Real-time RMS Energy calculation for VAD & Reactive UI
          let sumSquares = 0;
          for (let i = 0; i < chData.length; i++) sumSquares += chData[i] * chData[i];
          const rms = Math.sqrt(sumSquares / chData.length);
          const now = Date.now();

          // Audio-reactive orb animation
          if (orbInner && orbOuter) {
            const scale = Math.min(1.4, 1.0 + rms * 3.5);
            orbInner.style.transform = `scale(${scale})`;
            orbOuter.style.transform = `scale(${scale * 1.25})`;
            orbOuter.style.opacity = `${Math.min(0.9, 0.3 + rms * 2.5)}`;
          }

          // Voice Activity Detection (VAD)
          if (rms > 0.02) {
            if (!hasSpoken) {
              hasSpoken = true;
              speechStartTime = now;
            }
            silenceStartTime = 0;
          } else if (hasSpoken) {
            if (!silenceStartTime) silenceStartTime = now;
            // Auto-finish after 800ms silence or max 12s duration
            if (now - silenceStartTime > 800 || (now - speechStartTime > 12000)) {
              finishTurn(false);
            }
          }
        };

        src.connect(proc);
        proc.connect(loopCtx.destination);

        const finishTurn = async (abort) => {
          if (isProcessingTurn) return;
          isProcessingTurn = true;
          activeVoiceCutFn = null;

          try {
            proc.disconnect();
            src.disconnect();
            loopStream.getTracks().forEach(t => t.stop());
            if (loopCtx && loopCtx.state !== 'closed') loopCtx.close();
          } catch (_) {}

          if (abort || !voiceModeActive) return;

          let totalLength = 0;
          for (const chunk of loopChunks) totalLength += chunk.length;
          if (totalLength < 16000 * 0.4) {
            // Audio too short (<400ms)
            if (voiceModeActive) setTimeout(startPureVoiceLoop, 300);
            return;
          }

          const mergedPcm = new Float32Array(totalLength);
          let offset = 0;
          for (const chunk of loopChunks) {
            mergedPcm.set(chunk, offset);
            offset += chunk.length;
          }

          const resampled = resampleTo16k(mergedPcm, loopCtx ? loopCtx.sampleRate : 48000);
          const wavBlob = encodeToWav(resampled, 16000);

          statusEl.innerText = "Thinking";
          transcriptEl.innerText = "Transcribing...";
          if (orbInner) orbInner.style.transform = "scale(0.95)";
          if (orbOuter) orbOuter.style.opacity = "0.2";

          const fd = new FormData();
          fd.append("file", wavBlob, "voice.wav");
          fd.append("temperature", "0.0");
          fd.append("response_format", "json");

          try {
            const sttRes = await fetch(`${BASE_ENDPOINT}/inference`, { method: "POST", body: fd });
            if (!sttRes.ok) throw new Error(`STT HTTP ${sttRes.status}`);
            const sttData = await sttRes.json();
            const userSaid = sttData.text ? sttData.text.trim() : "";
            
            if (!userSaid) {
              statusEl.innerText = "Listening";
              transcriptEl.innerText = "Speak naturally...";
              if (voiceModeActive) setTimeout(startPureVoiceLoop, 300);
              return;
            }

            transcriptEl.innerText = `"${userSaid}"`;

            // SLM Chat Stream / Response with Multi-Turn In-Memory Voice History
            voiceSessionHistory.push({ role: "user", content: userSaid });
            const activeVoiceCtx = voiceSessionHistory.slice(-6);

            const chatRes = await fetch(`${BASE_ENDPOINT}/v1/chat/completions`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                messages: activeVoiceCtx,
                max_tokens: 80
              })
            });
            const chatData = await chatRes.json();
            const reply = (chatData.choices && chatData.choices[0].message ? chatData.choices[0].message.content : "").trim();
            if (reply) {
              voiceSessionHistory.push({ role: "assistant", content: reply });
            }
            
            transcriptEl.innerText = reply;
            statusEl.innerText = "Speaking";

            // TTS Call
            const ttsRes = await fetch(`${BASE_ENDPOINT}/v1/audio/speech`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ input: reply.replace(/[*#`_~]/g, "") })
            });
            const ttsBlob = await ttsRes.blob();
            const audio = document.getElementById("globalTtsAudio");
            audio.src = URL.createObjectURL(ttsBlob);
            
            // Pulse orb while speaking
            audio.onplay = () => {
              if (orbInner) orbInner.style.transform = "scale(1.15)";
              if (orbOuter) { orbOuter.style.transform = "scale(1.35)"; orbOuter.style.opacity = "0.7"; }
            };
            audio.onended = () => {
              if (orbInner) orbInner.style.transform = "scale(1)";
              if (orbOuter) { orbOuter.style.transform = "scale(1)"; orbOuter.style.opacity = "0.4"; }
              if (voiceModeActive) {
                setTimeout(startPureVoiceLoop, 300);
              }
            };
            audio.play();

          } catch (e) {
            statusEl.innerText = "Reconnecting";
            transcriptEl.innerText = "Error: " + e.message;
            if (voiceModeActive) setTimeout(startPureVoiceLoop, 1500);
          }
        };

        activeVoiceCutFn = finishTurn;

      } catch (err) {
        statusEl.innerText = "Mic Error";
        transcriptEl.innerText = err.message;
        if (voiceModeActive) setTimeout(startPureVoiceLoop, 2500);
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MobileAI — Multi-Modal Autonomous Conversational Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-color: #050609;
      --panel-bg: #0d0f15;
      --card-bg: rgba(18, 21, 31, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.35);
      --accent: #818cf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-subtle: #64748b;
      --user-bubble: #1e2230;
      --ai-bubble: transparent;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Ambient Background Glow */
    .bg-ambient {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.07) 0%, transparent 65%),
                  radial-gradient(circle at 100% 100%, rgba(129, 140, 248, 0.05) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* Top Navigation Bar */
    .chat-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(5, 6, 9, 0.8);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--card-border);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .btn-back {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.8rem;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      transition: all 0.2s;
    }

    .btn-back:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
      border-color: var(--primary);
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 10%, #cbd5e1 55%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .hardware-pill {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      color: #34d399;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.35rem 0.8rem;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #34d399;
      border-radius: 50%;
      box-shadow: 0 0 8px #34d399;
      animation: pulseDot 2s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .btn-icon-head {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
    }

    .btn-icon-head:hover {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text);
    }

    /* Main Chat Scroll Container */
    .chat-viewport {
      flex: 1;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 1.5rem 8rem;
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
      position: relative;
      z-index: 10;
    }

    /* Welcome Hero in Chat */
    .welcome-container {
      text-align: center;
      margin: 22vh auto 2rem;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .welcome-title {
      font-size: clamp(2.4rem, 5.5vw, 3.4rem);
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 1.2;
      background: linear-gradient(135deg, #ffffff 15%, #cbd5e1 55%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0;
    }

    .quick-card {
      background: rgba(18, 21, 31, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1rem 1.1rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
    }

    .quick-card:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .quick-card-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.25rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .quick-card-sub {
      font-size: 0.78rem;
      color: var(--text-subtle);
    }

    /* Message Rows */
    .message-row {
      display: flex;
      flex-direction: column;
      width: 100%;
      animation: fadeInMsg 0.25s ease-out;
    }

    @keyframes fadeInMsg {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* User Message Bubble */
    .message-row.user {
      align-items: flex-end;
    }

    .user-bubble {
      background: #181b24;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #f1f5f9;
      padding: 0.75rem 1.15rem;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.5;
      max-width: 82%;
      word-break: break-word;
    }

    /* AI Message */
    .message-row.ai {
      align-items: flex-start;
    }

    .ai-bubble-content {
      color: #f8fafc;
      font-size: 0.96rem;
      line-height: 1.6;
      width: 100%;
      word-break: break-word;
    }

    /* Markdown Formatting inside AI Bubble */
    .ai-bubble-content h1, .ai-bubble-content h2, .ai-bubble-content h3 {
      color: #fff;
      font-weight: 700;
      margin: 0.75rem 0 0.4rem;
      line-height: 1.3;
    }
    .ai-bubble-content h1 { font-size: 1.3rem; color: var(--primary); }
    .ai-bubble-content h2 { font-size: 1.15rem; color: var(--primary); }
    .ai-bubble-content h3 { font-size: 1.05rem; color: var(--accent); }
    .ai-bubble-content p { margin: 0.4rem 0; }
    .ai-bubble-content strong { color: #fff; font-weight: 700; }
    .ai-bubble-content em { color: #cbd5e1; font-style: italic; }
    .ai-bubble-content del { color: var(--text-subtle); text-decoration: line-through; }
    .ai-bubble-content ul, .ai-bubble-content ol { padding-left: 1.4rem; margin: 0.4rem 0; }
    .ai-bubble-content li { margin-bottom: 0.25rem; line-height: 1.5; }
    .ai-bubble-content code {
      font-family: 'JetBrains Mono', monospace;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: #38bdf8;
      padding: 0.15rem 0.4rem;
      border-radius: 6px;
      font-size: 0.88em;
    }
    .ai-bubble-content pre {
      background: #080a10;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 0.9rem 1.1rem;
      overflow-x: auto;
      margin: 0.75rem 0;
    }
    .ai-bubble-content pre code {
      background: transparent;
      border: none;
      padding: 0;
      color: #e2e8f0;
      font-size: 0.85rem;
      line-height: 1.5;
    }
    .ai-bubble-content blockquote {
      border-left: 3px solid var(--primary);
      background: rgba(56, 189, 248, 0.05);
      padding: 0.4rem 0.8rem;
      border-radius: 0 8px 8px 0;
      margin: 0.5rem 0;
      color: var(--text-muted);
    }
    .ai-bubble-content hr {
      border: 0;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      margin: 0.75rem 0;
    }

    /* Action Buttons Row under AI Message */
    .ai-action-bar {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 0.65rem;
    }

    .btn-ai-action {
      background: transparent;
      border: none;
      color: var(--text-subtle);
      padding: 0.35rem 0.5rem;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.82rem;
      font-family: inherit;
      transition: all 0.2s;
    }

    .btn-ai-action:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
    }

    .btn-ai-action.active-audio {
      color: var(--primary);
      background: rgba(56, 189, 248, 0.12);
    }

    /* Suggestion Chips Row */
    .followup-chips {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.4rem;
      margin-top: 0.85rem;
    }

    .followup-chip {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.88rem;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      cursor: pointer;
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .followup-chip:hover {
      color: var(--primary);
      background: rgba(56, 189, 248, 0.08);
      transform: translateX(3px);
    }

    /* Typing Cursor */
    .streaming-cursor {
      display: inline-block;
      width: 6px;
      height: 14px;
      background: var(--primary);
      margin-left: 4px;
      vertical-align: middle;
      animation: cursorBlink 0.8s infinite;
    }

    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Fixed Bottom Input Bar */
    .input-dock-container {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(180deg, transparent 0%, rgba(5, 6, 9, 0.95) 40%, #050609 100%);
      padding: 1.5rem 1rem 1.25rem;
      z-index: 50;
    }

    .input-capsule-bar {
      max-width: 820px;
      margin: 0 auto;
      background: #0f121a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      padding: 0.4rem 0.5rem 0.4rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transition: all 0.2s;
    }

    .input-capsule-bar:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 25px var(--primary-glow);
    }

    .chat-text-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 0.96rem;
      font-family: inherit;
      outline: none;
    }

    .chat-text-input::placeholder {
      color: var(--text-subtle);
    }

    /* Right Action Buttons in Input Bar */
    .input-actions-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Mic Button (Whisper STT) */
    .btn-mic-input {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      transition: all 0.2s;
    }

    .btn-mic-input:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    .btn-mic-input.recording {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.15);
      animation: micPulse 1.2s infinite;
    }

    @keyframes micPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    /* Pure Voice Chat Button (5th image - White Circle with Waveform) */
    .btn-voice-chat-circle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #ffffff;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
      transition: all 0.2s;
    }

    .btn-voice-chat-circle:hover {
      transform: scale(1.06);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.5);
    }

    .btn-voice-chat-circle svg {
      width: 22px;
      height: 22px;
      fill: #050609;
    }

    /* Pure Voice Mode Full-Screen Modal */
    .voice-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(5, 6, 9, 0.95);
      backdrop-filter: blur(25px);
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeInModal 0.3s ease-out;
    }

    @keyframes fadeInModal {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .voice-orb-container {
      position: relative;
      width: 180px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .voice-orb-outer {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
      animation: orbPulse 2s infinite ease-in-out;
    }

    .voice-orb-inner {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 2rem;
      box-shadow: 0 0 40px var(--primary-glow);
    }

    @keyframes orbPulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.35); opacity: 1; }
    }

    .voice-modal-status {
      margin-top: 2rem;
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
    }

    .voice-modal-transcript {
      margin-top: 0.75rem;
      font-size: 0.95rem;
      color: var(--text-muted);
      max-width: 500px;
      text-align: center;
      min-height: 40px;
    }

    .voice-modal-close {
      margin-top: 2.5rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 0.6rem 1.4rem;
      border-radius: 9999px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .voice-modal-close:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Dropdown Menu */
    .dropdown-menu {
      position: absolute;
      background: #12151f;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 0.4rem;
      display: none;
      flex-direction: column;
      gap: 0.2rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      z-index: 60;
    }

    .dropdown-item {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.5rem 0.85rem;
      border-radius: 6px;
      font-size: 0.85rem;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.15s;
    }

    .dropdown-item:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="bg-ambient"></div>

  <!-- HEADER -->
  <header class="chat-header">
    <div class="header-left">
      <a href="/" class="btn-back">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span>Dashboard</span>
      </a>
      <div class="brand-title">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="#38bdf8" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
        <span>MobileAI Studio</span>
      </div>
    </div>
    <div class="header-right">
      <div class="hardware-pill" id="telemetryBadge">
        <div class="status-dot"></div>
        <span id="telemetryStatusText">Redmi 9i Online</span>
      </div>
      <button class="btn-icon-head" onclick="clearChatHistory()" title="New Chat">
        <svg viewBox="0 0 24 24" width="17" height="17" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
      </button>
    </div>
  </header>

  <!-- CHAT VIEWPORT -->
  <main class="chat-viewport" id="chatViewport">
    <!-- WELCOME / INITIAL STATE -->
    <div class="welcome-container" id="welcomeContainer">
      <h1 class="welcome-title" id="welcomeTitle">Hi, Schrödinger’s Friend</h1>
    </div>

    <!-- MESSAGE THREAD CONTAINER -->
    <div id="messagesThread" style="display: flex; flex-direction: column; gap: 1.5rem; width: 100%;"></div>
  </main>

  <!-- BOTTOM INPUT CAPSULE DOCK -->
  <div class="input-dock-container">
    <div class="input-capsule-bar">
      <input type="text" id="mainChatInput" class="chat-text-input" placeholder="Ask anything..." onkeydown="if(event.key==='Enter') submitUserPrompt();" />
      
      <div class="input-actions-right">
        <!-- Mic Button for Speech-to-Text -->
        <button class="btn-mic-input" id="micRecordBtn" onclick="toggleVoiceInput()" title="Voice-to-Text (Whisper Base.en)">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
        </button>

        <!-- Pure Voice Chat Button (5th image white circular waveform) -->
        <button class="btn-voice-chat-circle" onclick="openPureVoiceMode()" title="Pure Voice Mode (Conversational Audio Loop)">
          <svg viewBox="0 0 24 24">
            <!-- Audio Waveform Bars Icon -->
            <rect x="4" y="9" width="2.5" height="6" rx="1.25"></rect>
            <rect x="8" y="5" width="2.5" height="14" rx="1.25"></rect>
            <rect x="12" y="3" width="2.5" height="18" rx="1.25"></rect>
            <rect x="16" y="7" width="2.5" height="10" rx="1.25"></rect>
            <rect x="20" y="10" width="2.5" height="4" rx="1.25"></rect>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- PURE VOICE MODE MODAL OVERLAY -->
  <div class="voice-modal-overlay" id="voiceModalOverlay">
    <div class="voice-orb-container">
      <div class="voice-orb-outer"></div>
      <div class="voice-orb-inner">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="currentColor">
          <rect x="4" y="9" width="2.5" height="6" rx="1.25"></rect>
          <rect x="8" y="5" width="2.5" height="14" rx="1.25"></rect>
          <rect x="12" y="3" width="2.5" height="18" rx="1.25"></rect>
          <rect x="16" y="7" width="2.5" height="10" rx="1.25"></rect>
          <rect x="20" y="10" width="2.5" height="4" rx="1.25"></rect>
        </svg>
      </div>
    </div>
    <div class="voice-modal-status" id="voiceModalStatus">Listening...</div>
    <div class="voice-modal-transcript" id="voiceModalTranscript">Speak freely — your voice is transcribed on-device by Whisper Base.en.</div>
    <button class="voice-modal-close" onclick="closePureVoiceMode()">End Voice Chat</button>
  </div>

  <!-- GLOBAL AUDIO ELEMENT FOR TTS -->
  <audio id="globalTtsAudio" style="display: none;"></audio>

  <script>
    const BASE_ENDPOINT = "https://black-term-8c36.botmaker583-55e.workers.dev";
    let isGenerating = false;
    let isRecordingAudio = false;
    let mediaRecorder = null;
    let audioChunks = [];
    let activeAudioBtn = null;
    let voiceModeActive = false;

    // Markdown Parser
    function renderMarkdown(raw) {
      if (typeof marked !== "undefined" && marked.parse) {
        try {
          return marked.parse(raw, { breaks: true, gfm: true });
        } catch (e) {}
      }
      return raw
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/```([a-z]*)\n([\s\S]*?)```/g, '<pre><code class="language-$1">$2</code></pre>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/__([^_]+)__/g, '<strong>$1</strong>')
        .replace(/\*([^*]+)\*/g, '<em>$1</em>')
        .replace(/_([^_]+)_/g, '<em>$1</em>')
        .replace(/\n/g, '<br/>');
    }

    function sendQuickPrompt(text) {
      const input = document.getElementById("mainChatInput");
      input.value = text;
      submitUserPrompt();
    }

    const RNG_TITLES = [
      "Schrödinger’s Friend",
      "Dearest Friend in the World",
      "Affectionate Partner"
    ];

    function applyRandomTitle() {
      const titleEl = document.getElementById("welcomeTitle");
      if (titleEl) {
        const randomIndex = Math.floor(Math.random() * RNG_TITLES.length);
        titleEl.innerText = RNG_TITLES[randomIndex];
      }
    }

    function clearChatHistory() {
      document.getElementById("messagesThread").innerHTML = "";
      applyRandomTitle();
      document.getElementById("welcomeContainer").style.display = "flex";
    }

    function renderInitialGreeting() {
      const thread = document.getElementById("messagesThread");
      if (!thread) return;
      thread.innerHTML = "";
      
      const aiRow = document.createElement("div");
      aiRow.className = "message-row ai";
      
      const contentEl = document.createElement("div");
      contentEl.className = "ai-bubble-content";
      contentEl.innerHTML = "Hi. How can I help you today?";
      aiRow.appendChild(contentEl);
      
      const actionBar = document.createElement("div");
      actionBar.className = "ai-action-bar";
      actionBar.innerHTML = `
        <button class="btn-ai-action" onclick="copyAiResponse(this)" title="Copy text">
          <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          <span>Copy</span>
        </button>
        <button class="btn-ai-action" onclick="readAloudText(this, 'Hi. How can I help you today?')" title="Read Aloud (TTS)">
          <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
          <span>Read Aloud</span>
        </button>
      `;
      aiRow.appendChild(actionBar);
      
      const chipsContainer = document.createElement("div");
      chipsContainer.className = "followup-chips";
      ["How can I help you today?", "What topics interest you?"].forEach(f => {
        const chip = document.createElement("button");
        chip.className = "followup-chip";
        chip.innerHTML = `<svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 10 20 15 15 20"></polyline><path d="M4 4v7a4 4 0 0 0 4 4h12"></path></svg> <span>${f}</span>`;
        chip.onclick = () => sendQuickPrompt(f);
        chipsContainer.appendChild(chip);
      });
      aiRow.appendChild(chipsContainer);
      thread.appendChild(aiRow);
    }

    function clearChatHistory() {
      applyRandomTitle();
      renderInitialGreeting();
    }

    // Set random title and initial greeting on page load
    applyRandomTitle();
    renderInitialGreeting();

    async function submitUserPrompt() {
      const input = document.getElementById("mainChatInput");
      const text = input.value.trim();
      if (!text || isGenerating) return;

      document.getElementById("welcomeContainer").style.display = "none";
      const thread = document.getElementById("messagesThread");
      input.value = "";

      // 1. Render User Message Row
      const userRow = document.createElement("div");
      userRow.className = "message-row user";
      userRow.innerHTML = `<div class="user-bubble">${text.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</div>`;
      thread.appendChild(userRow);

      // 2. Render AI Message Row with live streaming cursor
      const aiRow = document.createElement("div");
      aiRow.className = "message-row ai";
      const contentEl = document.createElement("div");
      contentEl.className = "ai-bubble-content";
      const cursorEl = document.createElement("span");
      cursorEl.className = "streaming-cursor";
      aiRow.appendChild(contentEl);
      aiRow.appendChild(cursorEl);
      thread.appendChild(aiRow);

      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });

      isGenerating = true;
      let fullText = "";
      const t0 = performance.now();

      try {
        const res = await fetch(`${BASE_ENDPOINT}/v1/chat/completions`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "text/event-stream"
          },
          body: JSON.stringify({
            messages: [{ role: "user", content: text }],
            temperature: 0.7,
            max_tokens: 350,
            stream: true
          })
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const reader = res.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";

        let isStreamFinished = false;
        while (!isStreamFinished) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop();

          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed || trimmed.startsWith(":")) continue;
            if (trimmed.includes("[DONE]")) {
              isStreamFinished = true;
              break;
            }
            if (trimmed.startsWith("data: ")) {
              try {
                const parsed = JSON.parse(trimmed.slice(6));
                const delta = parsed.choices?.[0]?.delta?.content;
                if (delta) {
                  fullText += delta;
                  contentEl.innerHTML = renderMarkdown(fullText);
                  window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
                }
              } catch (e) {}
            }
          }
        }
        try { reader.cancel(); } catch (e) {}

        // Remove cursor immediately when generation completes
        cursorEl.remove();

        // Attach Action Bar & Follow-up Suggestions
        const actionBar = document.createElement("div");
        actionBar.className = "ai-action-bar";
        actionBar.innerHTML = `
          <button class="btn-ai-action" onclick="copyAiResponse(this)" title="Copy text">
            <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            <span>Copy</span>
          </button>
          <button class="btn-ai-action" onclick="regeneratePrompt('${text.replace(/'/g, "\\'")}')" title="Regenerate">
            <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
            <span>Retry</span>
          </button>
          <button class="btn-ai-action" onclick="readAloudText(this, \`${fullText.replace(/[`$\\]/g, "")}\`)" title="Read Aloud (TTS)">
            <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
            <span>Read Aloud</span>
          </button>
        `;
        aiRow.appendChild(actionBar);

        // Smart dynamic follow-up chips
        const followups = generateFollowupSuggestions(text, fullText);
        if (followups.length > 0) {
          const chipsContainer = document.createElement("div");
          chipsContainer.className = "followup-chips";
          followups.forEach(f => {
            const chip = document.createElement("button");
            chip.className = "followup-chip";
            chip.innerHTML = `<svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 10 20 15 15 20"></polyline><path d="M4 4v7a4 4 0 0 0 4 4h12"></path></svg> <span>${f}</span>`;
            chip.onclick = () => sendQuickPrompt(f);
            chipsContainer.appendChild(chip);
          });
          aiRow.appendChild(chipsContainer);
        }

      } catch (err) {
        cursorEl.remove();
        contentEl.innerHTML = `<div style="display: flex; align-items: center; gap: 0.5rem; color: var(--danger); font-size: 0.9rem;"><svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg> <span>Generation error: ${err.message}</span></div>`;
      } finally {
        isGenerating = false;
        window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
      }
    }

    function generateFollowupSuggestions(userPrompt, aiReply) {
      const lower = userPrompt.toLowerCase();
      if (lower.includes("quantum")) {
        return ["Explain quantum superposition next", "What are real-world uses of quantum computing?"];
      } else if (lower.includes("python") || lower.includes("code")) {
        return ["Add error handling to this code", "Can you explain how this algorithm works line by line?"];
      } else if (lower.includes("hi") || lower.includes("hello")) {
        return ["How can I help you today?", "What topics interest you?"];
      }
      return ["Explain this in simpler terms", "Give me a practical example"];
    }

    function copyAiResponse(btn) {
      const parentAiRow = btn.closest(".message-row.ai");
      const text = parentAiRow.querySelector(".ai-bubble-content").innerText;
      navigator.clipboard.writeText(text);
      const span = btn.querySelector("span");
      const old = span.innerText;
      span.innerText = "Copied!";
      setTimeout(() => span.innerText = old, 1500);
    }

    function regeneratePrompt(text) {
      sendQuickPrompt(text);
    }

    async function readAloudText(btn, text) {
      const audio = document.getElementById("globalTtsAudio");
      if (activeAudioBtn === btn && !audio.paused) {
        audio.pause();
        btn.classList.remove("active-audio");
        btn.querySelector("span").innerText = "Read Aloud";
        activeAudioBtn = null;
        return;
      }

      if (activeAudioBtn) {
        activeAudioBtn.classList.remove("active-audio");
        activeAudioBtn.querySelector("span").innerText = "Read Aloud";
      }

      activeAudioBtn = btn;
      btn.classList.add("active-audio");
      btn.querySelector("span").innerText = "Synthesizing...";

      try {
        const cleanText = text.replace(/[*#`_~]/g, "").slice(0, 300);
        const res = await fetch(`${BASE_ENDPOINT}/v1/audio/speech`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ input: cleanText, speed: 1.0 })
        });
        if (!res.ok) throw new Error(`TTS HTTP ${res.status}`);
        const blob = await res.blob();
        audio.src = URL.createObjectURL(blob);
        btn.querySelector("span").innerText = "Playing...";
        audio.play();
        audio.onended = () => {
          btn.classList.remove("active-audio");
          btn.querySelector("span").innerText = "Read Aloud";
          activeAudioBtn = null;
        };
      } catch (err) {
        alert("TTS Error: " + err.message);
        btn.classList.remove("active-audio");
        btn.querySelector("span").innerText = "Read Aloud";
        activeAudioBtn = null;
      }
    }

    // =========================================================================
    // 🎙️ SPEECH-TO-TEXT (WHISPER BASE.EN) IN THE INPUT BAR
    // =========================================================================
    async function toggleVoiceInput() {
      const micBtn = document.getElementById("micRecordBtn");
      if (isRecordingAudio) {
        stopVoiceRecording();
      } else {
        startVoiceRecording();
      }
    }

    async function startVoiceRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = e => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = async () => {
          const audioBlob = new Blob(audioChunks, { type: "audio/wav" });
          const input = document.getElementById("mainChatInput");
          input.placeholder = "🧠 Transcribing audio with Whisper Base.en...";

          try {
            const fd = new FormData();
            fd.append("file", audioBlob, "speech.wav");
            fd.append("temperature", "0.0");
            fd.append("response_format", "json");

            const res = await fetch(`${BASE_ENDPOINT}/inference`, {
              method: "POST",
              body: fd
            });
            if (!res.ok) throw new Error(`STT HTTP ${res.status}`);
            const data = await res.json();
            const transcribed = data.text ? data.text.trim() : "";
            if (transcribed) {
              input.value = transcribed;
              submitUserPrompt();
            }
          } catch (e) {
            alert("Transcription error: " + e.message);
          } finally {
            input.placeholder = "Ask anything...";
          }
        };

        mediaRecorder.start();
        isRecordingAudio = true;
        document.getElementById("micRecordBtn").classList.add("recording");
      } catch (err) {
        alert("Microphone access required: " + err.message);
      }
    }

    function stopVoiceRecording() {
      if (mediaRecorder && isRecordingAudio) {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(t => t.stop());
        isRecordingAudio = false;
        document.getElementById("micRecordBtn").classList.remove("recording");
      }
    }

    // =========================================================================
    // 🔘 PURE VOICE CHAT MODE (WHISPER -> QWEN -> TTS AUDIO LOOP)
    // =========================================================================
    function openPureVoiceMode() {
      voiceModeActive = true;
      const modal = document.getElementById("voiceModalOverlay");
      modal.style.display = "flex";
      startPureVoiceLoop();
    }

    function closePureVoiceMode() {
      voiceModeActive = false;
      const modal = document.getElementById("voiceModalOverlay");
      modal.style.display = "none";
      stopVoiceRecording();
      const audio = document.getElementById("globalTtsAudio");
      audio.pause();
    }

    async function startPureVoiceLoop() {
      if (!voiceModeActive) return;
      const statusEl = document.getElementById("voiceModalStatus");
      const transcriptEl = document.getElementById("voiceModalTranscript");
      statusEl.innerText = "Listening...";
      transcriptEl.innerText = "Speak now — phone is listening...";

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const voiceRec = new MediaRecorder(stream);
        let chunks = [];

        voiceRec.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
        voiceRec.onstop = async () => {
          if (!voiceModeActive) return;
          statusEl.innerText = "Transcribing with Whisper Base.en...";
          const blob = new Blob(chunks, { type: "audio/wav" });
          const fd = new FormData();
          fd.append("file", blob, "voice.wav");
          fd.append("response_format", "json");

          try {
            const sttRes = await fetch(`${BASE_ENDPOINT}/inference`, { method: "POST", body: fd });
            const sttData = await sttRes.json();
            const userSaid = sttData.text ? sttData.text.trim() : "";
            if (!userSaid) {
              statusEl.innerText = "Didn't catch that.";
              setTimeout(startPureVoiceLoop, 1000);
              return;
            }

            transcriptEl.innerText = `You: "${userSaid}"`;
            statusEl.innerText = "Thinking with Qwen 2.5...";

            // SLM Chat Call
            const chatRes = await fetch(`${BASE_ENDPOINT}/v1/chat/completions`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                messages: [
                  { role: "system", content: "You are an autonomous voice AI. Give concise, conversational 1-2 sentence spoken answers." },
                  { role: "user", content: userSaid }
                ],
                max_tokens: 100
              })
            });
            const chatData = await chatRes.json();
            const reply = chatData.choices[0].message.content.trim();
            transcriptEl.innerText = `AI: "${reply}"`;
            statusEl.innerText = "Speaking...";

            // TTS Call
            const ttsRes = await fetch(`${BASE_ENDPOINT}/v1/audio/speech`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ input: reply.replace(/[*#`_~]/g, "") })
            });
            const ttsBlob = await ttsRes.blob();
            const audio = document.getElementById("globalTtsAudio");
            audio.src = URL.createObjectURL(ttsBlob);
            audio.play();
            audio.onended = () => {
              if (voiceModeActive) {
                setTimeout(startPureVoiceLoop, 500);
              }
            };
          } catch (e) {
            statusEl.innerText = "Error: " + e.message;
            setTimeout(startPureVoiceLoop, 2000);
          }
        };

        voiceRec.start();
        // Record 4-second audio window for conversational voice turn
        setTimeout(() => {
          if (voiceRec.state === "recording") {
            voiceRec.stop();
            stream.getTracks().forEach(t => t.stop());
          }
        }, 4000);

      } catch (err) {
        statusEl.innerText = "Microphone error";
      }
    }

    // Telemetry Poller for Header Status (100% Real Silicon State)
    async function updateHeaderTelemetry() {
      const badge = document.getElementById("telemetryBadge");
      const statusText = document.getElementById("telemetryStatusText");
      try {
        const res = await fetch(`${BASE_ENDPOINT}/telemetry`, { cache: "no-store" });
        if (res.ok) {
          const d = await res.json();
          badge.style.background = "rgba(16, 185, 129, 0.1)";
          badge.style.borderColor = "rgba(16, 185, 129, 0.25)";
          badge.style.color = "#34d399";
          const dot = badge.querySelector(".status-dot");
          if (dot) { dot.style.background = "#34d399"; dot.style.boxShadow = "0 0 8px #34d399"; }
          const bat = d.battery ? d.battery.level : 80;
          const temp = d.battery ? d.battery.temperature : 35.0;
          statusText.innerText = `Redmi 9i • ${bat}% Bat • ${temp}°C`;
        } else {
          badge.style.background = "rgba(239, 68, 68, 0.1)";
          badge.style.borderColor = "rgba(239, 68, 68, 0.3)";
          badge.style.color = "#f87171";
          const dot = badge.querySelector(".status-dot");
          if (dot) { dot.style.background = "#ef4444"; dot.style.boxShadow = "0 0 8px #ef4444"; }
          statusText.innerText = "Phone Reconnecting...";
        }
      } catch (e) {
        badge.style.background = "rgba(239, 68, 68, 0.1)";
        badge.style.borderColor = "rgba(239, 68, 68, 0.3)";
        badge.style.color = "#f87171";
        const dot = badge.querySelector(".status-dot");
        if (dot) { dot.style.background = "#ef4444"; dot.style.boxShadow = "0 0 8px #ef4444"; }
        statusText.innerText = "Phone Reconnecting...";
      }
    }
    setInterval(updateHeaderTelemetry, 3000);
    updateHeaderTelemetry();
  </script>

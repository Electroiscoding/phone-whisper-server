[package]
name = "swades"
version = "0.1.0"
edition = "2021"
description = "Official Rust client SDK for Swades / Phone Whisper Server"
license = "MIT OR Apache-2.0"

[dependencies]
reqwest = { version = "0.11", features = ["json", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
